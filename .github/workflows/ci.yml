name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit tests
        run: npm test
      # The export is generated: fail if someone edited src/ or prompts/ without
      # rebuilding, or edited the JSON by hand.
      - name: Export is up to date
        run: |
          npm run build
          git diff --exit-code workflows/

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Same version as docker-compose.yml: an export only imports reliably into the
      # n8n that made it.
      - name: Install n8n 2.41.4
        run: npm install --global --no-audit --no-fund n8n@2.41.4
      - name: End-to-end, fake APIs
        run: N8N_BIN="$(which n8n)" npm run e2e
